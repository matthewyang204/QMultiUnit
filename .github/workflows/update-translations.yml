name: Update Translations

permissions:
  contents: write

on:
  push:
    paths:
      - 'src/*.cpp'
      - 'src/*.h'
      - 'src/*.ui'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          cache: true

      - name: Run custom shell code
        uses: actions/checkout@v5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd src && make refresh-all && cd ..

          git add .
          git commit -m "Update translations $(git rev-parse HEAD)" || exit 0
          git push origin

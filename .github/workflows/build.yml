name: Build QMultiUnit

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    if: >-
      (github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'testing')) ||
      (github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-13

    defaults:
      run:
        shell: bash

    env:
      QT_VERSION: 6.5.3
      BUILD_DIR: ${{ github.workspace }}/build
      PACKAGE_DIR: ${{ github.workspace }}/package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb1

      - name: Configure
        run: >
          cmake
          -S src
          -B "$BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$PACKAGE_DIR"

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Deploy
        run: |
          rm -rf "$PACKAGE_DIR"
          cmake --install "$BUILD_DIR"

      - name: Smoke test deployed application (Linux)
        if: matrix.platform == 'linux'
        run: |
          application="$(find "$PACKAGE_DIR" -type f -name QMultiUnit -perm -u+x -print -quit)"
          test -n "$application"
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10s "$application"
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "QMultiUnit exited before the smoke-test timeout with status $status"
            exit "$status"
          fi

      - name: Smoke test deployed application (macOS)
        if: matrix.platform == 'macos'
        run: |
          app="$PACKAGE_DIR/QMultiUnit.app/Contents/MacOS/QMultiUnit"
          test -x "$app"
          QT_QPA_PLATFORM=offscreen "$app" &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            if wait "$pid"; then
              status=0
            else
              status=$?
            fi
            echo "QMultiUnit exited before the smoke test completed with status $status"
            exit "$status"
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Smoke test deployed application (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $application = Join-Path $env:PACKAGE_DIR "QMultiUnit.exe"
          if (-not (Test-Path $application)) {
            throw "Deployed executable was not found at $application"
          }
          $process = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              throw "QMultiUnit exited during the smoke test with status $($process.ExitCode)"
            }
          } else {
            Stop-Process -Id $process.Id
          }

      - name: Upload deployed binary
        uses: actions/upload-artifact@v4
        with:
          name: QMultiUnit-${{ matrix.platform }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
